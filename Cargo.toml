[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["ivlev-dev"]
repository = "https://github.com/ivlev-dev/tide-mail"
rust-version = "1.85"

[workspace.dependencies]
arc-swap = "1"
async-lock = "3"
base64 = "0.22"
bincode = "1.3"
byteorder = "1"
crc32c = "0.6"
crossbeam-channel = "0.5"
futures = "0.3"
futures-channel = "0.3"
idna = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
psl = "2"
io-uring = "0.7"
libc = "0.2"
mail-parser = { version = "1", features = ["full_encoding"] }
memmap2 = "0.9"
parking_lot = "0.12"
bytes = "1"
object_store = { version = "0.14", features = ["aws"] }
rand_core = { version = "0.6", features = ["getrandom"] }
proptest = "1"
roaring = "0.10"
hickory-resolver = "0.26"
mail-auth = { version = "0.16", features = ["arc"] }
tokio = { version = "1", features = ["rt", "time", "net"] }
rayon = "1"
rust-stemmers = "1.2"
x509-parser = "0.18"
sha2 = "0.11"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "webpki-roots"] }
serde = { version = "1", features = ["derive"] }
silent-protocol = "0.14"
tempfile = "3"
thiserror = "2"
unicode-segmentation = "1.12"
uuid = { version = "1", features = ["v4"] }
webpki-roots = "1"
zstd = "0.13"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
