[package]
name = "tide-server"
description = "io_uring powered Tide Mail server"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "tide"
path = "src/main.rs"

[dependencies]
argon2 = "0.5"
crossbeam-channel.workspace = true
base64.workspace = true
bincode.workspace = true
hickory-resolver.workspace = true
mail-auth.workspace = true
mail-parser.workspace = true
tokio.workspace = true
futures.workspace = true
httparse = "1"
monoio = { version = "0.2", features = ["macros", "sync"] }
monoio-rustls = "0.4"
parking_lot.workspace = true
rcgen = "0.14"
rustls = "0.23"
rustls-pemfile = "2"
x509-parser.workspace = true
sha2.workspace = true
reqwest.workspace = true
rand_core.workspace = true
serde = { version = "1", features = ["derive"] }
silent-protocol.workspace = true
thiserror.workspace = true
tide-core = { path = "../tide-core" }
tide-proto = { path = "../tide-proto" }
tide-smtp = { path = "../tide-smtp" }
tide-store = { path = "../tide-store" }
tide-sync = { path = "../tide-sync" }
tide-spam = { path = "../tide-spam" }
toml = "0.8"
uuid.workspace = true
webpki-roots.workspace = true

[dev-dependencies]
tempfile.workspace = true
