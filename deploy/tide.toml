[server]
hostname = "mail.local"
data_path = "/data/mail.tide"
# blob_dir = "/data/blobs"
data_lanes = 8
lane_capacity_mb = 512
workers = 2
http_addr = "0.0.0.0:8080"
http_tls = false
smtp_addr = "0.0.0.0:2525"
smtps_addr = "0.0.0.0:465"
submission_addr = "0.0.0.0:5870"
sync_addr = "0.0.0.0:9093"
token_ttl_hours = 168
outbound_enabled = false
outbound_tls = true
snapshot_interval_secs = 300
# admin_token = "change-me"
# backup_dir = "/data/backups"

[tls]
self_signed = true
# cert_path = "/etc/tide/fullchain.pem"
# key_path = "/etc/tide/privkey.pem"

[antivirus]
enabled = false
async_scan = false
# clamav_addr = "127.0.0.1:3310"

[blob]
backend = "local"
# bucket = "tide-mail"
# region = "us-east-1"
# endpoint = "https://s3.example.com"
# access_key_id = "..."
# secret_access_key = "..."
# prefix = "blobs"
# allow_http = false

[spam]
enabled = true
threshold = 5.0
reject_threshold = 15.0
# dnsbl_zones = ["zen.spamhaus.org"]
# external_command = "spamassassin"

[email_auth]
enabled = true
reject_spf_fail = false
reject_dmarc_fail = false

[dkim]
# domain = "mail.local"
# selector = "default"
# private_key_path = "/etc/tide/dkim.key"

[[accounts]]
email = "alice@mail.local"
password = "change-me"
name = "Alice"
